name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Configure signing
      # Optional: without the secrets the APKs are built unsigned.
      # Secrets: KEYSTORE_BASE64, KEYSTORE_ALIAS, KEYSTORE_PASSWORD
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "file=$RUNNER_TEMP/release.keystore"
            echo "alias=$KEYSTORE_ALIAS"
            echo "pwd=$KEYSTORE_PASSWORD"
          } > sign.properties
        else
          echo "::warning::No signing secrets configured; release APKs will be unsigned."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
    - name: Build release APKs
      run: ./gradlew assembleRelease

    - name: Collect APKs
      run: |
        mkdir dist
        for m in app tv automotive; do
          for f in $m/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/coradio-${m}-${GITHUB_REF_NAME}-$(basename "$f" | sed 's/^[^-]*-//')"
          done
        done
        ls -l dist

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
